<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - QR Code katalog</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
<div id="page" class="d-none">

<div class="ad-card p-4 text-center mx-auto" style="max-width:460px"><h2 class="h4 mb-1">Warung Makan Fina Berry</h2><p class="text-muted mb-3">Pindai untuk melihat menu dan memesan</p><div id="qr" class="d-inline-block p-2 bg-white"></div><div class="small text-muted mt-2 text-break" id="u"></div>
<div class="mt-3 no-print d-flex justify-content-center gap-2"><button class="btn btn-dark" onclick="window.print()"><i class="bi bi-printer"></i> Cetak</button><button class="btn btn-outline-dark" id="dl"><i class="bi bi-download"></i> Unduh PNG</button></div>
<p class="small text-muted mt-3 mb-0 no-print">Tempel di spanduk, kemasan, atau meja. Ganti alamat dengan domain asli saat website sudah live.</p></div>
</div>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/qrcode.js"></script>
<script src="assets/js/proto.js"></script>
<script>
(function(){
if(!FB.adminChrome('qr',2,'QR Code katalog'))return;
var url=new URL('menu.html',location.href).href;document.getElementById('u').textContent=url;new QRCode(document.getElementById('qr'),{text:url,width:280,height:280,correctLevel:QRCode.CorrectLevel.H});
document.getElementById('dl').onclick=function(){var c=document.querySelector('#qr canvas');if(!c)return;var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr-katalog-fina-berry.png';a.click()};
})();
</script>
</body>
</html>
