<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Biaya operasional</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
<div id="page" class="d-none">

<div class="row g-3"><div class="col-lg-4"><form id="f" class="ad-card p-3"><h2 class="h6">Catat biaya</h2><label class="form-label small mb-1">Tanggal</label><input type="date" class="form-control mb-2" value="2026-10-15" required><label class="form-label small mb-1">Kategori</label><select id="kt" class="form-select mb-2"><option>Belanja bahan baku</option><option>Gaji karyawan</option><option>Gas, listrik, air</option><option>Sewa tempat</option><option>Pemasaran</option><option>Lainnya</option></select>
<label class="form-label small mb-1">Keterangan</label><input id="ke" class="form-control mb-2" required placeholder="Contoh: gas elpiji 3 kg"><label class="form-label small mb-1">Jumlah (Rp)</label><input id="jm" type="number" class="form-control mb-3" min="1" required><button class="btn btn-primary w-100">Simpan</button><div class="form-text mt-2">Biaya di luar HPP menu dipakai untuk menghitung laba bersih.</div></form></div>
<div class="col-lg-8"><div class="ad-card p-3 mb-3 d-flex justify-content-between align-items-center"><span class="text-muted small">Total periode (Oktober 2026)</span><span class="fs-5 fw-bold" id="tot"></span></div><div class="ad-card p-3"><table class="table align-middle mb-0"><thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="text-end">Jumlah</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
</div>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/proto.js"></script>
<script>
(function(){
if(!FB.adminChrome('biaya',2,'Biaya operasional'))return;
var E=[['14/10/2026','Gas, listrik, air','Gas elpiji 3 kg x 4',60000],['12/10/2026','Belanja bahan baku','Daging sapi dan ayam',450000],['02/10/2026','Gaji karyawan','Gaji 2 karyawan',1800000],['02/10/2026','Sewa tempat','Sewa bulanan',600000]];
function draw(){document.getElementById('rows').innerHTML=E.map(function(e,i){return '<tr><td>'+e[0]+'</td><td>'+e[1]+'</td><td>'+e[2]+'</td><td class="text-end">'+FB.rp(e[3])+'</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" data-d="'+i+'"><i class="bi bi-trash"></i></button></td></tr>'}).join('');
 document.getElementById('tot').textContent=FB.rp(E.reduce(function(s,e){return s+e[3]},0));
 document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Hapus catatan biaya ini?')){E.splice(b.dataset.d,1);draw()}}})}
document.getElementById('f').onsubmit=function(e){e.preventDefault();E.unshift(['15/10/2026',kt.value,ke.value,parseInt(jm.value)]);ke.value=jm.value='';draw();FB.toast('Biaya operasional dicatat.','success')};draw();
})();
</script>
</body>
</html>
