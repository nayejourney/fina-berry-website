<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>
<div id="page" class="d-none">

<div class="row g-3 mb-4" id="stats"></div>
<div class="d-flex flex-wrap gap-2 mb-4"><a href="admin-kasir.html" class="btn btn-primary btn-lg"><i class="bi bi-calculator"></i> Input pesanan di warung</a><a href="admin-pesanan.html?status=aktif" class="btn btn-outline-dark btn-lg"><i class="bi bi-receipt"></i> Pesanan aktif</a></div>
<div class="ad-card p-3"><h2 class="h6 mb-3">Pesanan terbaru</h2><div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Kode</th><th>Waktu</th><th>Kanal</th><th>Pelanggan</th><th class="text-end">Total</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/proto.js"></script>
<script>
(function(){
if(!FB.adminChrome('dash',1,'Dashboard'))return;
function card(l,v,s,c,h){var i='<div class="ad-card p-3 h-100"><div class="text-muted small">'+l+'</div><div class="ad-stat '+(c||'')+'">'+v+'</div>'+(s||'')+'</div>';return '<div class="col-6 col-xl-3">'+(h?'<a href="'+h+'" class="text-decoration-none text-dark">'+i+'</a>':i)+'</div>'}
var s=card('Pesanan hari ini','12')+card('Menunggu','3','','text-warning','admin-pesanan.html?status=menunggu')+card('Diproses','2','','text-info','admin-pesanan.html?status=diproses')+card('Belum divalidasi bayar','4','','text-danger','admin-pesanan.html?bayar=belum_bayar');
if(FB.lvl()>=2)s+=card('Pendapatan hari ini','Rp 412.000','<div class="small text-muted">9 pesanan selesai</div>','','admin-laporan.html');
s+=card('Menu ditandai habis','1','','','admin-menu.html');
document.getElementById('stats').innerHTML=s;
document.getElementById('rows').innerHTML=FB.ORDERS.map(function(o){return '<tr class="'+(o.status==='menunggu'?'table-warning':'')+'"><td><a href="admin-pesanan-detail.html?id='+o.code+'">'+o.code+'</a></td><td>'+o.time+'</td><td>'+o.ch+'</td><td>'+o.name+'</td><td class="text-end">'+FB.rp(FB.orderTotal(o))+'</td><td>'+FB.badges(o)+'</td><td class="text-end"><a class="btn btn-sm btn-outline-primary" href="admin-pesanan-detail.html?id='+o.code+'">Buka</a></td></tr>'}).join('');
})();
</script>
</body>
</html>
